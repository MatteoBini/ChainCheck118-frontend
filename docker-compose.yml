# Frontend ChainCheck118 con immagine di PRODUZIONE (build statica servita da nginx).
# Per sviluppare usa docker-compose.dev.yml.
# Il backend si avvia dal repo ChainCheck118-backend ed è esposto sull'host alla porta 3000.
#
#   docker compose up --build -d        # → http://localhost:8080
#
# Variabili (facoltative, da .env): FRONTEND_PORT, VITE_USE_MOCKS, BACKEND_URL.

name: chaincheck118-frontend

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: runtime
      args:
        VITE_API_URL: /api
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
    image: chaincheck118-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
