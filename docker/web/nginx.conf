# Template: l'immagine nginx sostituisce ${BACKEND_URL} all'avvio del container.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Risoluzione a ogni richiesta: nginx parte anche se il backend non è ancora attivo.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend ${BACKEND_URL};

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # /api/auth/login → /auth/login
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO della mappa in tempo reale (long-polling e upgrade a WebSocket).
  location ~ ^/(ws|socket\.io)(/|$) {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Nomi con hash: cache lunga.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Predisposto per service worker e manifest (non ancora presenti).
  location ~* ^/(sw\.js|manifest\.webmanifest)$ {
    expires -1;
    try_files $uri =404;
  }

  # Fallback SPA.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
